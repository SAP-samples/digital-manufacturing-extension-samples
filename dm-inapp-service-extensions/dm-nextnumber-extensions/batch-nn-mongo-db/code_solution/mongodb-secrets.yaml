# DO NOT store real credentials in this file.
#
# Recommended approach — create the secret imperatively so values never
# touch the filesystem or git history:
#
#   kubectl create secret generic mongo-creds \
#     --from-literal=username=<your-admin-username> \
#     --from-literal=password=<your-strong-password>
#
# For production workloads on SAP BTP, store credentials in the
# SAP BTP Credential Store and inject them via the Kubernetes Secret
# Store CSI driver or the SAP BTP Service Operator:
#   https://help.sap.com/docs/credential-store
#
# If you must use a manifest, populate it at deploy time from a secrets
# manager and never commit a file containing real values.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-creds
stringData:
  username: REPLACE_ME
  password: REPLACE_ME
